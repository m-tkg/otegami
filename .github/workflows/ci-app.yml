name: ci-app

on:
  push:
    branches: [main]
    # アプリに影響しない push (ドキュメントのみ・サーバのみ) ではスキップ。
    # OtegamiKit はアプリのビルド/テスト対象なので除外しない。
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "server/**"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "server/**"

# 連続 push 時に古い実行を自動キャンセルする (タグ実行はグループが別になる
# だけでキャンセル対象の重複が起きない)。
concurrency:
  group: ci-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    # macos-26 (arm64) ships Xcode 27, which supports the iOS/macOS 26 SDKs
    # this app targets. Falls back to macos-latest if macos-26 is ever
    # retired before macos-latest catches up.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: cd apps/Otegami && xcodegen generate

      # CI has no signing identity/provisioning profile available, and
      # shouldn't need one — this job only verifies the app *builds*, not
      # that it's distributable. CODE_SIGNING_ALLOWED=NO (plus REQUIRED=NO
      # and a blank identity, belt-and-braces) skips codesigning entirely
      # instead of xcodebuild failing with "No profiles for ... were
      # found" under CODE_SIGN_STYLE: Automatic.
      #
      # OTHER_SWIFT_FLAGS below surfaces slow-to-type-check SwiftUI
      # expressions as build warnings (300ms is deliberately low — this
      # repo's local dev machines are fast enough that nothing trips it
      # even at that threshold, but this CI runner is slower, so it's the
      # earliest warning of a view getting dangerously close to the "the
      # compiler is unable to type-check this expression in reasonable
      # time" hard failure that took ci-app down for 5 consecutive runs
      # before `SidebarView`'s per-mailbox row was split into its own
      # `View`, docs/ci.md's troubleshooting notes). Deliberately *not*
      # `-warnings-as-errors`: that would also turn every other pre-
      # existing Swift warning in the codebase into a build failure, and
      # this threshold hasn't been proven safe across CI runner variance
      # yet — see docs/ci.md for the plan to tighten this once it has.
      - name: Build macOS app (unsigned)
        run: |
          xcodebuild \
            -project apps/Otegami/Otegami.xcodeproj \
            -scheme Otegami \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            OTHER_SWIFT_FLAGS="-Xfrontend -warn-long-expression-type-checking=300 -Xfrontend -warn-long-function-bodies=300" \
            build

      # iOS build-only check (generic Simulator destination — no need to
      # boot/select a concrete simulator just to compile). Actually running
      # OtegamiUITests needs the dev mailstack (Docker) and a booted
      # simulator; that's covered by scripts/verify-ios-m*.sh locally (see
      # docs/verify.md / docs/ci.md), not CI.
      - name: Build iOS app (Simulator, unsigned)
        run: |
          xcodebuild \
            -project apps/Otegami/Otegami.xcodeproj \
            -scheme Otegami \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            OTHER_SWIFT_FLAGS="-Xfrontend -warn-long-expression-type-checking=300 -Xfrontend -warn-long-function-bodies=300" \
            build

      - name: Test OtegamiKit
        run: cd packages/OtegamiKit && swift test

      # Task #170: apps/Otegami/Sources string literals that never got a
      # Localizable.xcstrings entry (always render in Japanese regardless
      # of the device's language setting) or a hardcoded English literal
      # bypassing the catalog (the reverse — always renders in English) —
      # see scripts/check-localizable-coverage.py's docstring. Also
      # reconfirms scripts/generate-localizable.py's `translations` dict
      # hasn't drifted from the committed catalog (docs/localization.md's
      # Task #145 note on that drift class).
      - name: Check localization coverage
        run: make check-localization
