name: release-macos

# Task #143: tag push (or manual dispatch) builds the macOS app, signs it
# with a Developer ID Application identity, notarizes it, and attaches the
# notarized .zip to a GitHub Release. iOS ships separately via the existing
# tag-triggered Xcode Cloud workflow (docs/xcode-cloud.md) — this workflow
# never touches iOS.
#
# See docs/release.md for the full picture (secrets required, why the app
# is signed with a bare `codesign` step instead of xcodebuild's own signing,
# and what's still unverified until the first real tag push).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version string to use when run manually (not from a tag push,
          e.g. via "Run workflow"). Ignored on an actual tag push, where the
          tag itself is the version. A manual run never creates/attaches to
          a GitHub Release — it only exercises the build/sign/notarize
          steps and uploads the result as a workflow artifact, so this
          workflow can be dry-run before ever pushing a real tag.
        required: false
        default: "0.0.0-dev"

permissions:
  contents: write

env:
  APP_DIR: apps/Otegami
  APP_PROJECT: apps/Otegami/Otegami.xcodeproj
  APP_SCHEME: Otegami
  APP_NAME: Otegami

jobs:
  release:
    # Same runner ci-app.yml already uses successfully for this app's
    # macOS/iOS 26 deployment target (Xcode 27's SDKs) — see that
    # workflow's own comment. Reusing it here means the "does the GitHub
    # runner's Xcode support this app's deployment target" question this
    # workflow would otherwise need to answer from scratch is already
    # answered by ci-app.yml's green runs.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
            VERSION="${TAG#v}"
            IS_TAG=true
          else
            TAG="$DISPATCH_VERSION"
            VERSION="$TAG"
            IS_TAG=false
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_tag=$IS_TAG" >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        run: brew install xcodegen

      # 実機フィードバック (v1.2.0-beta2): GitHub Actions には
      # Config/Local.xcconfig (git-ignored、docs/oauth-setup.md参照) が
      # 存在せず、この workflow にも Client ID を渡す仕組みが無かったため、
      # Release ビルドは Gmail/Microsoft OAuth が常に無効だった (「再認証に
      # 失敗しました: oauthUnavailable」)。secret から Local.xcconfig を
      # 生成することで解消する。
      #
      # - secret が未設定でも失敗させない — 他のビルダー/フォークが secret
      #   を登録していなくても、従来どおり OAuth 無効のままビルドが通る
      #   (`Signing.xcconfig`の`#include? "Local.xcconfig"`は任意 includeな
      #   ので、このファイル自体を作らなければ何も変わらない)。
      # - Client ID の値はログに出さない — `::add-mask::`で登録した上で、
      #   値を書き込む先はこのジョブのワークスペース内の一時ファイルのみ
      #   (コミットもアーティファクトへのアップロードもしない)。
      - name: Generate Local.xcconfig from OAuth Client ID secrets (optional)
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.OTEGAMI_GOOGLE_CLIENT_ID }}
          MICROSOFT_CLIENT_ID: ${{ secrets.OTEGAMI_MICROSOFT_CLIENT_ID }}
          # Task #171 follow-up (build-time relay registration secret —
          # see Config/Shared.xcconfig's doc comment on
          # OTEGAMI_RELAY_REGISTRATION_SECRET). Same optional/masked/
          # never-logged treatment as the two OAuth Client ID secrets
          # above.
          RELAY_REGISTRATION_SECRET: ${{ secrets.OTEGAMI_RELAY_REGISTRATION_SECRET }}
        run: |
          LOCAL_XCCONFIG="$APP_DIR/Config/Local.xcconfig"
          LINES=()
          if [ -n "$GOOGLE_CLIENT_ID" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_ID"
            LINES+=("GOOGLE_OAUTH_CLIENT_ID = $GOOGLE_CLIENT_ID")
            echo "Gmail OAuth: configured from OTEGAMI_GOOGLE_CLIENT_ID secret"
          else
            echo "Gmail OAuth: OTEGAMI_GOOGLE_CLIENT_ID secret not set — this build will have Gmail auth disabled"
          fi
          if [ -n "$MICROSOFT_CLIENT_ID" ]; then
            echo "::add-mask::$MICROSOFT_CLIENT_ID"
            LINES+=("OTEGAMI_MICROSOFT_CLIENT_ID = $MICROSOFT_CLIENT_ID")
            echo "Microsoft OAuth: configured from OTEGAMI_MICROSOFT_CLIENT_ID secret"
          else
            echo "Microsoft OAuth: OTEGAMI_MICROSOFT_CLIENT_ID secret not set — this build will have Microsoft auth disabled"
          fi
          if [ -n "$RELAY_REGISTRATION_SECRET" ]; then
            echo "::add-mask::$RELAY_REGISTRATION_SECRET"
            LINES+=("OTEGAMI_RELAY_REGISTRATION_SECRET = $RELAY_REGISTRATION_SECRET")
            echo "Push relay registration secret: configured from OTEGAMI_RELAY_REGISTRATION_SECRET secret"
          else
            echo "Push relay registration secret: OTEGAMI_RELAY_REGISTRATION_SECRET secret not set — this build sends no registration secret to the relay"
          fi
          if [ "${#LINES[@]}" -gt 0 ]; then
            printf '%s\n' "${LINES[@]}" > "$LOCAL_XCCONFIG"
          fi

      - name: Generate Xcode project
        run: cd "$APP_DIR" && xcodegen generate

      # Deliberately does NOT let xcodebuild do the signing itself.
      # xcodebuild's own signing (Automatic or Manual style) validates the
      # macOS target's iCloud KVS entitlement
      # (apps/Otegami/Config/Otegami-macOS.entitlements) against an
      # *installed provisioning profile* before it will even attempt to
      # codesign — confirmed locally: `CODE_SIGN_STYLE=Manual
      # CODE_SIGN_IDENTITY="Developer ID Application"` fails immediately
      # with `"Otegami" requires a provisioning profile with the iCloud
      # feature`, and Automatic style needs an authenticated Apple ID
      # session (or an App Store Connect API key) to fetch/create one,
      # neither of which this runner has — only a bare signing
      # identity/certificate is provided (see docs/release.md). So this
      # step builds fully unsigned instead, exactly like ci-app.yml's
      # "Build macOS app (unsigned)" step (same flags, same reasoning),
      # and a later step applies the Developer ID signature by hand with
      # `codesign` — which does not require a provisioning profile at all.
      # 実機フィードバック (2026-07-30「mac 版で、リリースを振る時はアプリの
      # バージョンとタグを合わせるようにしたい」): `Shared.xcconfig` の
      # `MARKETING_VERSION` は固定値 (iOS/TestFlight が数値のみの版数を要求
      # するため、そちらの都合で 1.2.0 のような形を保つ必要がある) なので、
      # macOS のリリースビルドでだけタグ由来の版数で上書きする。これにより
      # `CFBundleShortVersionString` がタグ (例 `v1.2.0-beta3` → `1.2.0-beta3`)
      # と一致し、アプリ内アップデートチェック (Task #158) の SemVer 比較も
      # 「配布物の版数 vs Release タグ」で正しく噛み合う (固定 1.2.0 のままだと
      # beta を入れているのに 1.2.0 > 1.2.0-beta3 と判定されてしまう)。
      # iOS 側 (Xcode Cloud) はこの workflow を通らないので影響しない。
      - name: Build macOS app (unsigned)
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          xcodebuild \
            -project "$APP_PROJECT" \
            -scheme "$APP_SCHEME" \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/build" \
            MARKETING_VERSION="$RELEASE_VERSION" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          echo "APP_PATH=$RUNNER_TEMP/build/Build/Products/Release/$APP_NAME.app" >> "$GITHUB_ENV"

      # 注入結果をここで確定的に確認する — 版数がタグと食い違ったまま配布
      # されるのが元の不具合だったので、ビルド直後に突き合わせて違えば失敗
      # させる (公証まで進んでから気付くと作り直しになる)。
      - name: Verify bundle version matches the tag
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          BUNDLE_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Contents/Info.plist")"
          echo "CFBundleShortVersionString=$BUNDLE_VERSION (expected $RELEASE_VERSION)"
          if [ "$BUNDLE_VERSION" != "$RELEASE_VERSION" ]; then
            echo "::error::CFBundleShortVersionString ($BUNDLE_VERSION) does not match the release version ($RELEASE_VERSION)" >&2
            exit 1
          fi

      - name: Check signing and notarization secrets
        id: signing
        env:
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
          P12: ${{ secrets.SIGNING_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          if [ -z "$SIGNING_IDENTITY" ] || [ -z "$P12" ] || [ -z "$P12_PASSWORD" ] \
            || [ -z "$NOTARY_APPLE_ID" ] || [ -z "$NOTARY_PASSWORD" ] || [ -z "$NOTARY_TEAM_ID" ]; then
            echo "::error::Signing and notarization secrets are required (see docs/release.md)" >&2
            exit 1
          fi

      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.SIGNING_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE="$RUNNER_TEMP/signing.p12"
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$CERTIFICATE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERTIFICATE" -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          echo "SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      # Config/Otegami-macOS.entitlements is the *source* xcconfig-style
      # template — its iCloud KVS identifier is the literal, unexpanded
      # macro string "$(TeamIdentifierPrefix)$(CFBundleIdentifier)".
      # xcodebuild normally substitutes that at its own codesign time; a
      # bare `codesign --entitlements` does not do any substitution, so
      # signing straight from this file would embed that literal string
      # and silently break iCloud KVS sync. Resolve it by hand first.
      # TeamIdentifierPrefix expands to "<TEAMID>." (trailing dot
      # included) — see Apple's build setting reference — and the bundle
      # id is the repo's committed default (Config/Signing.xcconfig);
      # GitHub Actions never has a Config/Local.xcconfig overriding it.
      # v1.1.0-beta の実地で判明した落とし穴: iCloud KVS
      # (`com.apple.developer.ubiquity-kvstore-identifier`) は「制限付き」
      # entitlement で、provisioning profile が埋め込まれていない Developer
      # ID アプリに付けると **macOS が起動自体を拒否する** (launchd spawn
      # failed / POSIX 163 — Gatekeeper は通るのに開けない)。対処は二択:
      # - `MACOS_PROVISIONING_PROFILE_BASE64` secret (Developer ID 用
      #   provisioning profile、iCloud capability 付き) が登録されていれば
      #   `Contents/embedded.provisionprofile` として埋め込み、entitlement
      #   を保ったまま署名する (iCloud 同期が Release ビルドでも機能する)。
      # - 無ければ iCloud entitlement を落として署名する (起動はするが
      #   macOS Release ビルドの iCloud アカウント同期は無効 —
      #   docs/release.md 参照)。
      - name: Resolve macOS entitlements
        env:
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          MACOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          RESOLVED="$RUNNER_TEMP/Otegami-macOS.resolved.entitlements"
          # $(OTEGAMI_KEYCHAIN_GROUP) は Shared.xcconfig の
          # `$(DEVELOPMENT_TEAM).$(OTEGAMI_BUNDLE_ID).shared` — xcodebuild の
          # 署名なら自動展開されるが、bare codesign はマクロを知らない。
          # 展開し忘れるとリテラル文字列がそのまま entitlement に埋まり、
          # Keychain 問い合わせが全部落ちる (2026-07-29 の macOS Keychain
          # Access Group 共有対応で追加)。
          sed \
            -e "s/\$(TeamIdentifierPrefix)/${NOTARY_TEAM_ID}./" \
            -e "s/\$(CFBundleIdentifier)/com.mtkg.otegami/" \
            -e "s/\$(OTEGAMI_KEYCHAIN_GROUP)/${NOTARY_TEAM_ID}.com.mtkg.otegami.shared/" \
            "$APP_DIR/Config/Otegami-macOS.entitlements" > "$RESOLVED"
          if [ -n "$MACOS_PROVISIONING_PROFILE_BASE64" ]; then
            echo "$MACOS_PROVISIONING_PROFILE_BASE64" | base64 -d \
              > "$APP_PATH/Contents/embedded.provisionprofile"
            echo "provisioning profile embedded — keeping restricted entitlements"
          else
            # keychain-access-groups も制限付き entitlement — profile 無しで
            # 付けると iCloud KVS と同じ launchd 起動拒否 (POSIX 163) を踏む
            # ため、iCloud KVS と一緒に落とす。
            /usr/libexec/PlistBuddy -c \
              "Delete :com.apple.developer.ubiquity-kvstore-identifier" \
              "$RESOLVED" || true
            /usr/libexec/PlistBuddy -c \
              "Delete :keychain-access-groups" \
              "$RESOLVED" || true
            echo "no provisioning profile secret — stripped restricted entitlements"
          fi
          echo "RESOLVED_ENTITLEMENTS=$RESOLVED" >> "$GITHUB_ENV"

      - name: Sign app bundle (Developer ID)
        env:
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
        run: |
          codesign --force --deep --options runtime --timestamp \
            --entitlements "$RESOLVED_ENTITLEMENTS" \
            --sign "$SIGNING_IDENTITY" \
            "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Notarize and staple
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/$APP_NAME-notary.zip"
          xcrun notarytool submit "$RUNNER_TEMP/$APP_NAME-notary.zip" \
            --apple-id "$NOTARY_APPLE_ID" \
            --password "$NOTARY_PASSWORD" \
            --team-id "$NOTARY_TEAM_ID" \
            --wait
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"

      - name: Create release archive
        run: |
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$RUNNER_TEMP/$APP_NAME.zip"

      - name: Create GitHub Release
        if: steps.version.outputs.is_tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # v1.2.0-beta の実地で判明: pre-release suffix 付きタグを
          # --prerelease 無しで公開すると GitHub 上は「安定版」扱いになり、
          # アプリ内アップデートチェック (Task #158、通常クリック=安定版のみ)
          # がベータを安定版として案内してしまう。suffix (ハイフン) の有無で
          # フラグを出し分ける。
          PRERELEASE_FLAG=""
          case "${{ steps.version.outputs.version }}" in
            *-*) PRERELEASE_FLAG="--prerelease" ;;
          esac
          gh release create "${{ steps.version.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes \
            $PRERELEASE_FLAG \
            "$RUNNER_TEMP/$APP_NAME.zip"

      # workflow_dispatch (no tag) skips the Release step above so a manual
      # run never publishes anything — the built/signed/notarized .zip is
      # still available as a downloadable workflow artifact for
      # inspection.
      - name: Upload build artifact (manual runs only)
        if: steps.version.outputs.is_tag == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/${{ env.APP_NAME }}.zip
          retention-days: 14

      - name: Clean up signing keychain
        if: always()
        run: |
          if [ -n "${SIGN_KEYCHAIN:-}" ]; then
            security delete-keychain "$SIGN_KEYCHAIN" || true
          fi
