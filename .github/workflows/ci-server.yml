name: ci-server

on:
  push:
    branches: [main]
    # サーバ関連の変更時だけ実行 (アプリだけの push では回さない)。
    # 共有 DTO (OtegamiRelayAPI) の変更もワイヤ契約に影響するため含める。
    paths:
      - "server/**"
      - "packages/OtegamiKit/Sources/OtegamiRelayAPI/**"
      - ".github/workflows/ci-server.yml"
  pull_request:
    paths:
      - "server/**"
      - "packages/OtegamiKit/Sources/OtegamiRelayAPI/**"
      - ".github/workflows/ci-server.yml"

# 連続 push 時に古い実行を自動キャンセルする (タグ実行はグループが別になる
# だけでキャンセル対象の重複が起きない)。
concurrency:
  group: ci-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  relay-go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/otegami-relay-go
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: server/otegami-relay-go/go.mod
          cache-dependency-path: server/otegami-relay-go/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
