# Overrides the image's default auth.conf (which accepts any username with
# a fixed password from an env var) with a small static set of test
# accounts, read from a passwd-file. No userdb block is defined on purpose:
# without one, Dovecot falls back to the global mail_uid / mail_gid /
# mail_home settings from the base image config, which already point at
# /srv/vmail/%{user | lower} — exactly where our named users below resolve.
passdb passwd-file {
  passwd_file_path = /etc/dovecot/users
}

# The base image's default config disables plaintext LOGIN on non-TLS
# connections (a sane default for anything internet-facing). This stack is
# localhost-only dev/test data with throwaway credentials, and the whole
# point of exposing plain IMAP on 1143 (see compose.yml) is for clients that
# haven't wired up STARTTLS yet — so explicitly re-enable it here. Dovecot
# 2.4's config system renamed the old `disable_plaintext_auth` setting to
# `auth_allow_cleartext` (inverted sense: allow, not disable).
auth_allow_cleartext = yes
