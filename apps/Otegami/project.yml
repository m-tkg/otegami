name: Otegami
options:
  createIntermediateGroups: true
  # Otegami.xcodeproj is a generated artifact (see .gitignore); `xcodegen
  # generate` must be run after checkout/pull and before opening in Xcode.
  bundleIdPrefix: com.mtkg
  # 表示・操作改善バッチ「表示言語の設定」: 開発言語 (String Catalog の
  # sourceLanguage、`Resources/Localizable.xcstrings`) は日本語 — このアプリ
  # の既存 UI コードが最初から日本語の文字列リテラルを直接
  # `Text`/`Button`/`Label` に書いている (`docs/localization.md`参照) ため、
  # ソース言語を日本語にすることで既存コードの変更なしにそれらがそのまま
  # String Catalog のキーとして機能する。
  developmentLanguage: ja

# Signing (DEVELOPMENT_TEAM / PRODUCT_BUNDLE_IDENTIFIER) lives in
# Config/Signing.xcconfig, which itself #includes Config/Shared.xcconfig, so
# each developer can override signing via the untracked Config/Local.xcconfig
# without touching either committed file. Do not add those keys back to
# `settings:` below — values expanded into the pbxproj take precedence over
# xcconfig and would break the override.
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

packages:
  OtegamiKit:
    path: ../../packages/OtegamiKit

targets:
  Otegami:
    type: application
    # Single target, two destinations (Xcode's multiplatform app target),
    # so iOS and macOS share the same sources/scheme instead of duplicating
    # a target per platform.
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "26.0"
      macOS: "26.0"
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Generated/Info.plist
      properties:
        # Debug → `Otegami-dev` / Release → `Otegami` (Config/Shared.xcconfig
        # の `OTEGAMI_DISPLAY_NAME_*`)。ホーム画面でローカル起動ビルドと
        # TestFlight/OTA のリリース版を見分けられるようにする。
        CFBundleDisplayName: $(OTEGAMI_DISPLAY_NAME)
        # Task #49 (Xcode Cloud/TestFlight 整備, docs/xcode-cloud.md):
        # XcodeGen の `info.path` モードはこのキーを指定しない限り
        # CFBundleVersion に固定リテラル "1" を自動生成してしまい、
        # CURRENT_PROJECT_VERSION (Config/Shared.xcconfig) を変えても
        # 反映されない。マクロ参照にしておけば、ビルド時に xcconfig の
        # 値がそのまま埋め込まれる — 他の環境依存キー (GOOGLE_OAUTH_CLIENT_ID
        # 等、このファイル内で既に同じ書き方をしている) と同じ理屈。
        # `ci_scripts/ci_post_clone.sh` は Xcode Cloud の `CI_BUILD_NUMBER`
        # を `Config/Local.xcconfig` に `CURRENT_PROJECT_VERSION` として書き込み、
        # Signing.xcconfig の `#include? "Local.xcconfig"` 経由で
        # Shared.xcconfig の既定値 (1) を上書きする — ローカル開発時は
        # Local.xcconfig にこの行が無いので既定値 1 のまま変わらない。
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # 2026-07-30 の実機フィードバック (「リリースを振る時はアプリの
        # バージョンとタグを合わせたい」) を実装した際に発覚: `CFBundleVersion`
        # と同じ落とし穴がこちらにもあり、**このキーを宣言していなかったため
        # XcodeGen が固定リテラル `1.0` を生成していた** — `MARKETING_VERSION`
        # (Config/Shared.xcconfig、および release-macos.yml がタグから注入する
        # 値) を変えても表示バージョンは 1.0 のままだった。マクロ参照に
        # することで xcconfig / xcodebuild 引数の値がそのまま埋め込まれる。
        # release-macos.yml のビルド後検証ステップがこの不一致を検出した。
        CFBundleShortVersionString: $(MARKETING_VERSION)
        # Task #49: TestFlight へのアップロードは Export Compliance
        # (暗号化の輸出規制申告) の回答を要求する。このアプリが使う暗号化は
        # IMAP/SMTP over TLS (MailCore2)・HTTPS (URLSession, Google OAuth/
        # otegami-relay 通信)・Keychain (OS 標準) のみで、いずれも
        # 「標準的な暗号化 (standard TLS 等)」として輸出規制の対象外
        # (exempt) — 独自暗号アルゴリズムの実装や、輸出規制対象国向けの
        # 特別な強度の暗号は一切含まない。`false` にしておくことで
        # App Store Connect Web 側の質問への回答を毎回アップロードごとに
        # 求められるのを避けられる (判断根拠は `docs/xcode-cloud.md` に
        # 記録)。
        ITSAppUsesNonExemptEncryption: false
        # 表示・操作改善バッチ「表示言語の設定」— どの言語をこのバンドルが
        # 提供するか。`LocalizationSettingsStore`が`AppleLanguages`を
        # ["ja"]/["en"]に上書きしたとき、`Bundle.main`が実際にその
        # ローカライズを見つけられるのはこのリストに含まれているときだけ。
        CFBundleLocalizations: [ja, en]
        # M6: Gmail OAuth Client ID, sourced from the `GOOGLE_OAUTH_CLIENT_ID`
        # xcconfig build setting (`Config/Shared.xcconfig` defines it empty;
        # `Config/Local.xcconfig`, git-ignored, is where a builder sets
        # their own — see docs/oauth-setup.md). `GoogleOAuthConfig` reads
        # this key at runtime and treats empty/unset as "Gmail unavailable
        # in this build".
        GOOGLE_OAUTH_CLIENT_ID: $(GOOGLE_OAUTH_CLIENT_ID)
        # Task #116 第2段: Outlook.com/Office 365 OAuth Client ID, same
        # xcconfig-sourced mechanism as GOOGLE_OAUTH_CLIENT_ID just above
        # (`Config/Shared.xcconfig` defines it empty; `Config/Local.xcconfig`,
        # git-ignored, is where a builder sets their own — see
        # docs/oauth-setup.md). `MicrosoftOAuthConfig` reads this key at
        # runtime and treats empty/unset as "Outlook/Office365 unavailable
        # in this build".
        OTEGAMI_MICROSOFT_CLIENT_ID: $(OTEGAMI_MICROSOFT_CLIENT_ID)
        # Task #171 follow-up: self-hosted push relay's optional
        # `RELAY_DEVICE_REGISTRATION_SECRET`, same xcconfig-sourced
        # build-time-secret mechanism as GOOGLE_OAUTH_CLIENT_ID/
        # OTEGAMI_MICROSOFT_CLIENT_ID just above (`Config/Shared.xcconfig`
        # defines it empty; `Config/Local.xcconfig`, git-ignored, is where a
        # self-hoster sets their own — see docs/relay-deployment.md).
        # `RelayRegistrationSecretConfig` reads this key at runtime and
        # treats empty/unset as "omit the Authorization header on device
        # registration" (unchanged default behavior).
        OTEGAMI_RELAY_REGISTRATION_SECRET: $(OTEGAMI_RELAY_REGISTRATION_SECRET)
        # Task #173 follow-up: self-hosted push relay's URL itself, same
        # xcconfig-sourced build-time mechanism as
        # OTEGAMI_RELAY_REGISTRATION_SECRET just above (`Config/Shared.xcconfig`
        # defines it empty; `Config/Local.xcconfig`, git-ignored, is where a
        # self-hoster sets their own — see docs/relay-deployment.md).
        # `RelayURLConfig` reads this key at runtime and treats empty/unset
        # as "no relay configured in this build", disabling
        # PushNotificationSettingsView's enable button.
        OTEGAMI_PUSH_RELAY_URL: $(OTEGAMI_PUSH_RELAY_URL)
        # M9: read by AppEnvironment/KeychainCredentialStore/AppDatabase at
        # runtime — see Config/Shared.xcconfig's doc comment on why these
        # are composed from xcconfig variables instead of hardcoded.
        OtegamiAppGroupIdentifier: $(OTEGAMI_APP_GROUP)
        OtegamiKeychainAccessGroup: $(OTEGAMI_KEYCHAIN_GROUP)
        # Required on physical iOS devices for any local-network connection
        # (e.g. the dev mailstack on the Mac's LAN IP, or a self-hosted relay
        # on the LAN). Without this key iOS terminates the app on the first
        # local-network socket instead of showing the permission prompt —
        # the simulator does not enforce this, which is why every simulator
        # verification passed while a real device crashed on 接続テスト.
        NSLocalNetworkUsageDescription: ローカルネットワーク上のメールサーバー (開発用サーバーや自宅サーバーなど) に接続するために使用します。
        # 表示・操作改善バッチ「添付ボタンの統合」の「写真を撮る」
        # (`CameraPicker`, `UIImagePickerController.sourceType == .camera`) —
        # このキーがないと権限ダイアログを出さずに即クラッシュする。
        NSCameraUsageDescription: メール作成時に写真を撮って添付するために使用します。
        # アバター強化バッチ フェーズ1「連絡先の写真」— `ContactPhotoResolver`
        # が初めてメールアドレスを照合しようとした瞬間に OS の権限ダイアログ
        # を出す。既存の `NSCameraUsageDescription`/`NSLocalNetworkUsageDescription`
        # と同じく、このプロジェクトには Info.plist キー専用の英語ローカラ
        # イズ機構 (`InfoPlist.xcstrings`) が無いため日本語のみ
        # (`docs/localization.md`参照 — UI文字列の`Localizable.xcstrings`は
        # Info.plistキーの対象外)。
        NSContactsUsageDescription: 差出人の写真を表示するために連絡先を使用します。
        # Task #48 (デフォルトメールアプリ対応): registers this app as a
        # candidate handler for `mailto:` links (`OtegamiApp.handleOpenURL(_:)`
        # / `MailtoURLParser`) on both platforms. This alone lets the OS route
        # a `mailto:` open here (and lets `xcrun simctl openurl` target this
        # app for testing) regardless of entitlement state; actually becoming
        # the system *default* additionally needs the
        # `com.apple.developer.mail-client` entitlement — see
        # OTEGAMI_MAIL_CLIENT_ENTITLEMENT below and docs/default-mail-app.md.
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER).mailto
            CFBundleURLSchemes:
              - mailto
        # Task #48: read by `DefaultMailAppSettingsView` to decide whether
        # this *build* actually carries the mail-client entitlement (not
        # just whether the flag exists — a stray "デフォルトのメールアプリに
        # 設定" shortcut that doesn't work because the entitlement was never
        # granted would be worse than no shortcut). String, not a real
        # Info.plist Boolean — XcodeGen renders this YAML value as a
        # `<string>`, and Xcode's Info.plist preprocessor substitutes
        # `$(OTEGAMI_MAIL_CLIENT_ENTITLEMENT)` textually into whatever type
        # the entry already is, so the built value is literally the text
        # "YES" or "NO" (same mechanism `GOOGLE_OAUTH_CLIENT_ID` above
        # already relies on) — compare against the string, not `as? Bool`.
        OtegamiMailClientEntitlementEnabled: $(OTEGAMI_MAIL_CLIENT_ENTITLEMENT)
        # Task #205 (実機報告: HTML メール内の `http://` (非 `https`) 画像が
        # 常に壊れたアイコンになる — mac/iOS 共通): App Transport Security は
        # このキーが無い限り平文 `http` の読み込みを既定でブロックする。この
        # アプリは `WKContentRuleList`/`ImageSettingsStore`
        # (`HTMLMessageView.swift`) で「リモート画像を読み込むかどうか」を
        # 既に自前でユーザーに選ばせている — ATS がその上にさらに `http` だけ
        # 無条件ブロックすると、ユーザーが読み込みを許可した (既定 ON) 後です
        # ら `http` 画像だけは常に読み込みに失敗し (`WKContentRuleList`は
        # 効いていないので「遮断された」見た目の "画像を表示" バナーは出ず、
        # ただ壊れたアイコンだけが残る)、「画像を表示」ボタンを追加しても
        # 意味がない。`NSAllowsArbitraryLoadsInWebContent`は`WKWebView`が
        # 読み込む コンテンツだけに ATS 制限を解除する Apple 公式のキー —
        # このアプリ自身の通信 (IMAP/SMTP は MailCore2 独自のソケット層で
        # ATS の対象外、OAuth/relay/iCloud は元から https のみ) には一切
        # 影響しない、意図的にスコープを絞った緩和。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        # Communication Notifications (iOS-only, Task: 送信者アバター付き
        # プッシュ通知): Apple's documentation requires the containing app
        # itself (not just the NotificationService Extension that actually
        # builds the `INSendMessageIntent`, `NSExtensionAttributes` below)
        # to declare `INSendMessageIntent` as a supported `NSUserActivity`
        # type — this is what makes the app a legitimate donor of that
        # intent kind at all (Siri/Shortcuts/search surface it this way).
        # See Config/Otegami-iOS.entitlements' doc comment for the actual
        # entitlement this feature also needs.
        NSUserActivityTypes:
          - INSendMessageIntent
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        # iOS-only (Config/Otegami-iOS.entitlements' own doc comment
        # explains why macOS intentionally gets no App Group/Keychain
        # Access Group/aps-environment here).
        #
        # Referenced via the `$(OTEGAMI_IOS_ENTITLEMENTS_FILE)` xcconfig
        # macro rather than a literal path — Task #48 (デフォルトメールアプリ
        # 対応): Config/Shared.xcconfig's `OTEGAMI_MAIL_CLIENT_ENTITLEMENT`
        # flag picks between Config/Otegami-iOS.entitlements (default) and
        # Config/Otegami-iOS-MailClient.entitlements (opt-in, once Apple has
        # granted `com.apple.developer.mail-client`) — see that xcconfig's
        # doc comment for why this has to be a macro reference here, not a
        # literal, for an xcconfig-level override to actually take effect.
        CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: $(OTEGAMI_IOS_ENTITLEMENTS_FILE)
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: $(OTEGAMI_IOS_ENTITLEMENTS_FILE)
        # M11: macOS *does* get an entitlements file now (unlike M9's App
        # Group/Keychain Access Group, which stayed iOS-only per the doc
        # comment above) — iCloud account sync needs to reach both
        # platforms for its whole point ("iOS で追加したアカウントが Mac にも
        # 出現する") to hold. Otegami-macOS.entitlements is its own,
        # deliberately minimal file (just the one KVS key) rather than
        # reusing Otegami-iOS.entitlements — see that file's doc comment.
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Config/Otegami-macOS.entitlements
        # The asset catalog carries a separate appiconset per platform
        # (iOS wants a single 1024x1024 "universal" image; macOS wants the
        # full 16–512pt @1x/@2x set), so the compiler needs to be told which
        # one to use for each destination it's compiling for.
        ASSETCATALOG_COMPILER_APPICON_NAME[sdk=macosx*]: AppIcon-macOS
        ASSETCATALOG_COMPILER_APPICON_NAME[sdk=iphoneos*]: AppIcon
        ASSETCATALOG_COMPILER_APPICON_NAME[sdk=iphonesimulator*]: AppIcon
        # M10 fix: XcodeGen's default LD_RUNPATH_SEARCH_PATHS for a
        # multiplatform target is a single "@executable_path/Frameworks",
        # correct for iOS (flat bundle: MyApp.app/Frameworks/ sits right
        # next to MyApp.app/MyApp) but wrong for macOS, where the executable
        # lives a level deeper at MyApp.app/Contents/MacOS/MyApp and the
        # embedded frameworks are copied to MyApp.app/Contents/Frameworks/
        # — one directory up from Frameworks, not a sibling. Without this,
        # `make mac`'s Debug builds happened to still launch (an *extra*,
        # DerivedData-build-specific absolute rpath Xcode also adds for
        # local "run" builds papered over it), but `make mac-app`'s
        # Release build — a standalone bundle meant to be copied out of
        # DerivedData into dist/ — crashed at launch with "Library not
        # loaded: @rpath/MailCore.framework/.../MailCore" the moment it
        # was run from anywhere else. Confirmed with `otool -l`: the
        # Debug build's *only* rpath that actually resolves once moved is
        # this same wrong one, so this would have broken on-device too had
        # it ever been tested standalone. Adding the correct macOS-specific
        # rpath alongside (not replacing) the existing one keeps iOS as-is.
        LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]: "$(inherited) @executable_path/../Frameworks"
    dependencies:
      - package: OtegamiKit
        product: OtegamiCore
      - package: OtegamiKit
        product: MailTransport
      - package: OtegamiKit
        product: OtegamiStore
      - package: OtegamiKit
        product: SyncEngine
      - package: OtegamiKit
        product: OtegamiRelayAPI
      - package: OtegamiKit
        product: MailTransportMailCore
      - package: OtegamiKit
        product: GoogleOAuth
      - package: OtegamiKit
        product: MicrosoftOAuth
      - package: OtegamiKit
        product: GooglePeople
      - package: OtegamiKit
        product: PushRelayClient
      - package: OtegamiKit
        product: AccountCloudSync
      - package: OtegamiKit
        product: OtegamiTranslation
      - package: OtegamiKit
        product: OtegamiTranslationFoundationModels
      - package: OtegamiKit
        product: OtegamiTranslationApple
      - package: OtegamiKit
        product: TranslationEngine
      - package: OtegamiKit
        product: BIMI
      - target: NotificationService
        embed: true
        platformFilter: iOS

  # M9: push-received extension. iOS only (`platform:` below, and embedded
  # into the Otegami target only for the iOS destination via
  # `platformFilter` above) — macOS's notification model doesn't route
  # through a Notification Service Extension the same way, and the plan's
  # push relay is scoped to keeping a phone's badge/banner useful while the
  # app isn't foregrounded, which is an iOS-specific concern here. Receives
  # the minimal `accountId`/`uidNext` push payload (`OtegamiRelayAPI
  # .PushNotificationPayload`) and re-fetches just the newest envelope over
  # IMAP to fill in sender/subject before the notification is shown — see
  # NotificationService/NotificationService.swift's doc comment for the
  # full flow and the App Group/Keychain Access Group sharing this depends
  # on.
  NotificationService:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: NotificationService
    info:
      path: Generated/NotificationService-Info.plist
      properties:
        # 本体と同じ `OTEGAMI_DISPLAY_NAME` (Debug では `Otegami-dev`)。
        CFBundleDisplayName: $(OTEGAMI_DISPLAY_NAME)
        # Task #49: keep in lockstep with the main app's CFBundleVersion
        # (same macro-reference reasoning as the Otegami target's own
        # CFBundleVersion above) — App Store Connect's build validation
        # rejects an archive whose embedded extension's CFBundleVersion
        # doesn't match its containing app.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # 本体と同じ理由でこちらもマクロ参照にする (上の
        # `CFBundleShortVersionString` の doc 参照) — 埋め込み extension の
        # 表示バージョンが本体と食い違うのを避ける。
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
          # Communication Notifications: some blog posts claim an app
          # extension that donates an `INSendMessageIntent` needs to declare
          # it here too, mirroring the app target's own `NSUserActivityTypes`
          # above; Apple's own Communication Notifications documentation
          # doesn't mention this key at all for the *extension* side (only
          # for the containing app). Added anyway since it's harmless if
          # unnecessary — **whether this actually affects anything is
          # unverified**; don't treat its presence (or removal) as fixing or
          # breaking the feature without a real-device test either way.
          NSExtensionAttributes:
            IntentsSupported:
              - INSendMessageIntent
        OtegamiAppGroupIdentifier: $(OTEGAMI_APP_GROUP)
        OtegamiKeychainAccessGroup: $(OTEGAMI_KEYCHAIN_GROUP)
        # Task #177 (`.oauth2` account push enrichment): this Extension's
        # own `Bundle.main` is its own bundle, not the containing app's —
        # same reasoning `OtegamiAppGroupIdentifier`/`OtegamiKeychainAccessGroup`
        # above already rely on — so it needs its own copies of the two
        # OAuth Client ID keys the `Otegami` target declares above
        # (`GOOGLE_OAUTH_CLIENT_ID`/`OTEGAMI_MICROSOFT_CLIENT_ID`'s own doc
        # comments there explain the xcconfig-sourced mechanism; unchanged
        # here). `NotificationService.swift`'s `OAuthConfig` enum is what
        # reads these two keys back out at runtime.
        GOOGLE_OAUTH_CLIENT_ID: $(GOOGLE_OAUTH_CLIENT_ID)
        OTEGAMI_MICROSOFT_CLIENT_ID: $(OTEGAMI_MICROSOFT_CLIENT_ID)
        # Phase 3 (NSE のリレー先読み統合): `NotificationService.swift`'s own
        # `pushRelayBaseURL` reads this back out — same "own bundle, own
        # copy of the app's `RelayURLConfig`" reasoning as the two Client ID
        # keys right above. Sourced from the same `OTEGAMI_PUSH_RELAY_URL`
        # xcconfig build setting the `Otegami` target's own Info.plist
        # already exposes (`Config/Shared.xcconfig`/`Config/Local.xcconfig`
        # — see `RelayURLConfig.swift`'s doc comment), so a self-hoster's
        # single xcconfig value covers both targets.
        OTEGAMI_PUSH_RELAY_URL: $(OTEGAMI_PUSH_RELAY_URL)
    entitlements:
      path: Generated/NotificationService.entitlements
      properties:
        com.apple.security.application-groups:
          - $(OTEGAMI_APP_GROUP)
        keychain-access-groups:
          - $(OTEGAMI_KEYCHAIN_GROUP)
        # Communication Notifications (`com.apple.developer.usernotifications
        # .communication`, Config/Otegami-iOS.entitlements' doc comment):
        # deliberately *not* added here. Apple's Communication Notifications
        # documentation lists this entitlement as something the containing
        # *app* target requests, not an app extension — `NotificationService`
        # is the target that actually builds/donates the `INSendMessageIntent`
        # and applies `content.updating(from:)`, but the entitlement itself
        # stays app-side. If sender avatars ever fail to appear on a real
        # device with the app-side entitlement correctly granted, adding it
        # here too is the first thing to try.

    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        # Bundle id is derived from the app's, per Signing.xcconfig's doc
        # comment ("将来 Extension 等の ID もここから導出する").
        PRODUCT_BUNDLE_IDENTIFIER: $(OTEGAMI_BUNDLE_ID).NotificationService
    dependencies:
      - package: OtegamiKit
        product: OtegamiCore
      - package: OtegamiKit
        product: MailTransport
      - package: OtegamiKit
        product: MailTransportMailCore
      - package: OtegamiKit
        product: OtegamiStore
      - package: OtegamiKit
        product: OtegamiRelayAPI
      - package: OtegamiKit
        product: SyncEngine
      # Task #177: `GoogleOAuth.TokenStore`/`MicrosoftOAuth.TokenStore` (the
      # same refresh-token-to-access-token exchange `AppEnvironment.auth(for:)`
      # already uses for a foregrounded `.oauth2` sync) plus
      # `PushRelayClient.PushOAuthAccessTokenResolution` (the timeout-racing
      # wrapper around that exchange), plus the shared notification content
      # preference and enrichment policy used directly by the Extension.
      - package: OtegamiKit
        product: GoogleOAuth
      - package: OtegamiKit
        product: MicrosoftOAuth
      - package: OtegamiKit
        product: PushRelayClient

  # iOS-only: drives the real app (XCUIApplication) against the dev
  # mailstack for M1's automated simulator verification. See
  # Scripts/verify-ios-m1.sh and docs/verify.md.
  OtegamiUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: UITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mtkg.otegami.uitests
    dependencies:
      - target: Otegami

  # Phase 5 (テスト衛生): Otegami アプリ本体専用のユニットテストターゲット。
  # `OtegamiUITests` と違い `XCUIApplication`/実機シミュレータには依存せず、
  # 純粋ロジック関数 (`AppEnvironment.isPushWatchCandidate(_:)`) を
  # `@testable import` で直接呼ぶだけの軽量テスト。
  #
  # `Otegami` (application) への `dependencies:` だけで XcodeGen が
  # `TEST_HOST`/`BUNDLE_LOADER` を自動設定してくれる (生成された
  # project.pbxproj で確認済み — Xcode の「ホストアプリケーション」選択と
  # 同じ効果)。`NotificationService` (app-extension) はここに含めていない
  # — extension は `Otegami.app` の実行バイナリの一部ではなく別バイナリ
  # (`NotificationService.appex`) なので、`Otegami` をホストにしても
  # extension 側のシンボルはリンクされず「Undefined symbols」でリンク
  # エラーになる (実際に踏んだ)。extension 内のロジックは下の
  # `NotificationServiceTests` に分けている。
  #
  # deploymentTarget を意図的に指定していない: `Otegami` は
  # `supportedDestinations: [iOS, macOS]` のマルチプラットフォームターゲット
  # で、この XcodeGen バージョン (2.45.4 時点) はマルチプラットフォーム
  # ターゲットに `IPHONEOS_DEPLOYMENT_TARGET` を書き出さない (生成された
  # project.pbxproj を確認済み — `Otegami` ターゲットの buildSettings に
  # そのキー自体が存在しない)。そのため実際のビルドでは Xcode 側のデフォルト
  # 解決に委ねられており、`@testable import Otegami` するこのターゲットの
  # deploymentTarget を "26.0" のように明示指定すると、
  # 「compiling for iOS 26.0, but module 'Otegami' has a minimum deployment
  # target of iOS 27.0」のようなビルド環境依存のミスマッチで壊れうる (この
  # ミスマッチの実際の値は Xcode のバージョンによって変わりうる)。ここも
  # 明示指定を省略して同じ既定解決に委ねることで `Otegami` 側と常に一致させる。
  OtegamiAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/OtegamiAppTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mtkg.otegami.apptests
    dependencies:
      - target: Otegami

  # Phase 5 (テスト衛生): `NotificationService` extension 専用のユニット
  # テストターゲット。`OtegamiAppTests` (Otegami アプリ本体を TEST_HOST に
  # 使う) と同じ手は使えない — extension は独立したバイナリなので
  # `Otegami` をホストにしても `NotificationService.parsePayload(_:)` の
  # シンボルは解決できない (未定義シンボルでリンクエラー、実際に確認済み)。
  # `TEST_HOST`/`BUNDLE_LOADER` を `NotificationService.appex` 自身の
  # バイナリ (埋め込み後・埋め込み前どちらの成果物パスでも試した) に
  # 向ける方法も試したが、`xcodebuild test` は毎回「Could not find test
  # host」でビルド前検証そのものに失敗した — Apple の TEST_HOST は
  # 公式には application 型のホストのみをサポートしており、app-extension
  # 型はそもそも対象外という制約に行き当たったと見られる。
  #
  # 採用した方法: `@testable import NotificationService` で別モジュールを
  # クロスインポートするのではなく、`NotificationService.swift` 自身を
  # このテストターゲットの `sources` にも追加してこのターゲット内で直接
  # コンパイルする (ホスト不要・クロスモジュールリンク不要)。ソース
  # ファイルを複数ターゲットが指すのは XcodeGen/Xcode の通常の使い方で、
  # ファイル自体は変更していない。依存パッケージは
  # `NotificationService` ターゲット自身の `dependencies:` と同じ一式を
  # 複製する必要がある (同じファイルが同じ import 文を持つため)。
  NotificationServiceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/NotificationServiceTests
      - path: NotificationService/NotificationService.swift
      # Communication Notifications: `CommunicationNotificationDecisionTests`
      # exercises `NotificationService.senderDecision(...)`/
      # `.conversationIdentifier(accountId:senderAddress:)`, both defined in
      # this file — same "add the new file explicitly, ファイル明示" reason
      # this target's own doc comment above gives for
      # `NotificationService.swift` itself.
      - path: NotificationService/CommunicationNotification.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mtkg.otegami.notificationservicetests
    dependencies:
      - package: OtegamiKit
        product: OtegamiCore
      - package: OtegamiKit
        product: MailTransport
      - package: OtegamiKit
        product: MailTransportMailCore
      - package: OtegamiKit
        product: OtegamiStore
      - package: OtegamiKit
        product: OtegamiRelayAPI
      - package: OtegamiKit
        product: SyncEngine
      - package: OtegamiKit
        product: GoogleOAuth
      - package: OtegamiKit
        product: MicrosoftOAuth
      - package: OtegamiKit
        product: PushRelayClient

schemes:
  Otegami:
    build:
      targets:
        Otegami: all
        OtegamiUITests: [test]
        OtegamiAppTests: [test]
        NotificationServiceTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OtegamiUITests
        - OtegamiAppTests
        - NotificationServiceTests
    archive:
      config: Release
