name: Otegami
options:
  createIntermediateGroups: true
  # Otegami.xcodeproj is a generated artifact (see .gitignore); `xcodegen
  # generate` must be run after checkout/pull and before opening in Xcode.
  bundleIdPrefix: com.m-tkg

# Signing (DEVELOPMENT_TEAM / PRODUCT_BUNDLE_IDENTIFIER) lives in
# Config/Signing.xcconfig, which itself #includes Config/Shared.xcconfig, so
# each developer can override signing via the untracked Config/Local.xcconfig
# without touching either committed file. Do not add those keys back to
# `settings:` below — values expanded into the pbxproj take precedence over
# xcconfig and would break the override.
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

packages:
  OtegamiKit:
    path: ../../packages/OtegamiKit

targets:
  Otegami:
    type: application
    # Single target, two destinations (Xcode's multiplatform app target),
    # so iOS and macOS share the same sources/scheme instead of duplicating
    # a target per platform.
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "26.0"
      macOS: "26.0"
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Otegami
        # M6: Gmail OAuth Client ID, sourced from the `GOOGLE_OAUTH_CLIENT_ID`
        # xcconfig build setting (`Config/Shared.xcconfig` defines it empty;
        # `Config/Local.xcconfig`, git-ignored, is where a builder sets
        # their own — see docs/oauth-setup.md). `GoogleOAuthConfig` reads
        # this key at runtime and treats empty/unset as "Gmail unavailable
        # in this build".
        GOOGLE_OAUTH_CLIENT_ID: $(GOOGLE_OAUTH_CLIENT_ID)
        # M9: read by AppEnvironment/KeychainCredentialStore/AppDatabase at
        # runtime — see Config/Shared.xcconfig's doc comment on why these
        # are composed from xcconfig variables instead of hardcoded.
        OtegamiAppGroupIdentifier: $(OTEGAMI_APP_GROUP)
        OtegamiKeychainAccessGroup: $(OTEGAMI_KEYCHAIN_GROUP)
        # Required on physical iOS devices for any local-network connection
        # (e.g. the dev mailstack on the Mac's LAN IP, or a self-hosted relay
        # on the LAN). Without this key iOS terminates the app on the first
        # local-network socket instead of showing the permission prompt —
        # the simulator does not enforce this, which is why every simulator
        # verification passed while a real device crashed on 接続テスト.
        NSLocalNetworkUsageDescription: ローカルネットワーク上のメールサーバー (開発用サーバーや自宅サーバーなど) に接続するために使用します。
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        # iOS-only (Config/Otegami-iOS.entitlements' own doc comment
        # explains why macOS intentionally gets no App Group/Keychain
        # Access Group/aps-environment here).
        CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: Config/Otegami-iOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: Config/Otegami-iOS.entitlements
        # M11: macOS *does* get an entitlements file now (unlike M9's App
        # Group/Keychain Access Group, which stayed iOS-only per the doc
        # comment above) — iCloud account sync needs to reach both
        # platforms for its whole point ("iOS で追加したアカウントが Mac にも
        # 出現する") to hold. Otegami-macOS.entitlements is its own,
        # deliberately minimal file (just the one KVS key) rather than
        # reusing Otegami-iOS.entitlements — see that file's doc comment.
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Config/Otegami-macOS.entitlements
        # The asset catalog carries a separate appiconset per platform
        # (iOS wants a single 1024x1024 "universal" image; macOS wants the
        # full 16–512pt @1x/@2x set), so the compiler needs to be told which
        # one to use for each destination it's compiling for.
        ASSETCATALOG_COMPILER_APPICON_NAME[sdk=macosx*]: AppIcon-macOS
        ASSETCATALOG_COMPILER_APPICON_NAME[sdk=iphoneos*]: AppIcon
        ASSETCATALOG_COMPILER_APPICON_NAME[sdk=iphonesimulator*]: AppIcon
        # M10 fix: XcodeGen's default LD_RUNPATH_SEARCH_PATHS for a
        # multiplatform target is a single "@executable_path/Frameworks",
        # correct for iOS (flat bundle: MyApp.app/Frameworks/ sits right
        # next to MyApp.app/MyApp) but wrong for macOS, where the executable
        # lives a level deeper at MyApp.app/Contents/MacOS/MyApp and the
        # embedded frameworks are copied to MyApp.app/Contents/Frameworks/
        # — one directory up from Frameworks, not a sibling. Without this,
        # `make mac`'s Debug builds happened to still launch (an *extra*,
        # DerivedData-build-specific absolute rpath Xcode also adds for
        # local "run" builds papered over it), but `make mac-app`'s
        # Release build — a standalone bundle meant to be copied out of
        # DerivedData into dist/ — crashed at launch with "Library not
        # loaded: @rpath/MailCore.framework/.../MailCore" the moment it
        # was run from anywhere else. Confirmed with `otool -l`: the
        # Debug build's *only* rpath that actually resolves once moved is
        # this same wrong one, so this would have broken on-device too had
        # it ever been tested standalone. Adding the correct macOS-specific
        # rpath alongside (not replacing) the existing one keeps iOS as-is.
        LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]: "$(inherited) @executable_path/../Frameworks"
    dependencies:
      - package: OtegamiKit
        product: OtegamiCore
      - package: OtegamiKit
        product: MailTransport
      - package: OtegamiKit
        product: OtegamiStore
      - package: OtegamiKit
        product: SyncEngine
      - package: OtegamiKit
        product: OtegamiRelayAPI
      - package: OtegamiKit
        product: MailTransportMailCore
      - package: OtegamiKit
        product: GoogleOAuth
      - package: OtegamiKit
        product: PushRelayClient
      - package: OtegamiKit
        product: AccountCloudSync
      - package: OtegamiKit
        product: OtegamiTranslation
      - package: OtegamiKit
        product: OtegamiTranslationFoundationModels
      - package: OtegamiKit
        product: TranslationEngine
      - target: NotificationService
        embed: true
        platformFilter: iOS

  # M9: push-received extension. iOS only (`platform:` below, and embedded
  # into the Otegami target only for the iOS destination via
  # `platformFilter` above) — macOS's notification model doesn't route
  # through a Notification Service Extension the same way, and the plan's
  # push relay is scoped to keeping a phone's badge/banner useful while the
  # app isn't foregrounded, which is an iOS-specific concern here. Receives
  # the minimal `accountId`/`uidNext` push payload (`OtegamiRelayAPI
  # .PushNotificationPayload`) and re-fetches just the newest envelope over
  # IMAP to fill in sender/subject before the notification is shown — see
  # NotificationService/NotificationService.swift's doc comment for the
  # full flow and the App Group/Keychain Access Group sharing this depends
  # on.
  NotificationService:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: NotificationService
    info:
      path: Generated/NotificationService-Info.plist
      properties:
        CFBundleDisplayName: Otegami
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
        OtegamiAppGroupIdentifier: $(OTEGAMI_APP_GROUP)
        OtegamiKeychainAccessGroup: $(OTEGAMI_KEYCHAIN_GROUP)
    entitlements:
      path: Generated/NotificationService.entitlements
      properties:
        com.apple.security.application-groups:
          - $(OTEGAMI_APP_GROUP)
        keychain-access-groups:
          - $(OTEGAMI_KEYCHAIN_GROUP)
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        # Bundle id is derived from the app's, per Signing.xcconfig's doc
        # comment ("将来 Extension 等の ID もここから導出する").
        PRODUCT_BUNDLE_IDENTIFIER: $(OTEGAMI_BUNDLE_ID).NotificationService
    dependencies:
      - package: OtegamiKit
        product: OtegamiCore
      - package: OtegamiKit
        product: MailTransport
      - package: OtegamiKit
        product: MailTransportMailCore
      - package: OtegamiKit
        product: OtegamiStore
      - package: OtegamiKit
        product: OtegamiRelayAPI
      - package: OtegamiKit
        product: SyncEngine

  # iOS-only: drives the real app (XCUIApplication) against the dev
  # mailstack for M1's automated simulator verification. See
  # Scripts/verify-ios-m1.sh and docs/verify.md.
  OtegamiUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: UITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.m-tkg.otegami.uitests
    dependencies:
      - target: Otegami

schemes:
  Otegami:
    build:
      targets:
        Otegami: all
        OtegamiUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OtegamiUITests
    archive:
      config: Release
