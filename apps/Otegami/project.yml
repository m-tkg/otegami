name: Otegami
options:
  createIntermediateGroups: true
  # Otegami.xcodeproj is a generated artifact (see .gitignore); `xcodegen
  # generate` must be run after checkout/pull and before opening in Xcode.
  bundleIdPrefix: com.m-tkg

# Signing (DEVELOPMENT_TEAM / PRODUCT_BUNDLE_IDENTIFIER) lives in
# Config/Signing.xcconfig, which itself #includes Config/Shared.xcconfig, so
# each developer can override signing via the untracked Config/Local.xcconfig
# without touching either committed file. Do not add those keys back to
# `settings:` below — values expanded into the pbxproj take precedence over
# xcconfig and would break the override.
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

packages:
  OtegamiKit:
    path: ../../packages/OtegamiKit

targets:
  Otegami:
    type: application
    # Single target, two destinations (Xcode's multiplatform app target),
    # so iOS and macOS share the same sources/scheme instead of duplicating
    # a target per platform.
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "26.0"
      macOS: "26.0"
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Otegami
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        # The asset catalog carries a separate appiconset per platform
        # (iOS wants a single 1024x1024 "universal" image; macOS wants the
        # full 16–512pt @1x/@2x set), so the compiler needs to be told which
        # one to use for each destination it's compiling for.
        ASSETCATALOG_COMPILER_APPICON_NAME[sdk=macosx*]: AppIcon-macOS
        ASSETCATALOG_COMPILER_APPICON_NAME[sdk=iphoneos*]: AppIcon
        ASSETCATALOG_COMPILER_APPICON_NAME[sdk=iphonesimulator*]: AppIcon
    dependencies:
      - package: OtegamiKit
        product: OtegamiCore
      - package: OtegamiKit
        product: MailTransport
      - package: OtegamiKit
        product: OtegamiStore
      - package: OtegamiKit
        product: SyncEngine
      - package: OtegamiKit
        product: OtegamiRelayAPI
      - package: OtegamiKit
        product: MailTransportMailCore

  # iOS-only: drives the real app (XCUIApplication) against the dev
  # mailstack for M1's automated simulator verification. See
  # Scripts/verify-ios-m1.sh and docs/verify.md.
  OtegamiUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: UITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.m-tkg.otegami.uitests
    dependencies:
      - target: Otegami

schemes:
  Otegami:
    build:
      targets:
        Otegami: all
        OtegamiUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OtegamiUITests
    archive:
      config: Release
